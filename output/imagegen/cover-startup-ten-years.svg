<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">创业十年，赚了一些钱</title>
  <desc id="desc">一张用于博客封面的横版图片，深色背景，强调创业十年、赚了一些钱，以及创始人、资金、启动条件这三个主题。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d10" />
      <stop offset="52%" stop-color="#151a1f" />
      <stop offset="100%" stop-color="#24201a" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#d5a75a" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#d5a75a" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#d5a75a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#c79d55" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0b56c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0b56c" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.55" />

  <rect x="70" y="70" width="1460" height="760" rx="28" fill="none" stroke="#f1c37a" stroke-opacity="0.16" stroke-width="1.5" />
  <line x1="120" y1="168" x2="520" y2="168" stroke="url(#line)" stroke-width="3" />
  <line x1="120" y1="740" x2="610" y2="740" stroke="url(#line)" stroke-width="2" />

  <text x="1040" y="520" font-family="Bahnschrift, DIN Alternate, Arial Narrow, sans-serif" font-size="440" font-weight="700" fill="none" stroke="#efc27b" stroke-opacity="0.09" stroke-width="2">10</text>

  <g font-family="'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif">
    <text x="120" y="145" font-size="20" letter-spacing="5" fill="#f0c57a" fill-opacity="0.85">REAL NOTES FROM TEN YEARS OF BUILDING</text>

    <text x="120" y="330" font-size="126" font-weight="700" fill="#f4efe6">创业十年</text>
    <text x="120" y="430" font-size="58" font-weight="500" fill="#d8b36a">赚了一些钱</text>

    <text x="124" y="510" font-size="24" fill="#d2d7dc" fill-opacity="0.72">跟谁一起干，要不要拿别人的钱，什么时候才算真的可以启动。</text>

    <text x="124" y="612" font-size="22" fill="#a8b0b8" fill-opacity="0.84">创始人 / 资金 / 启动条件</text>
    <text x="124" y="650" font-size="22" fill="#7f8892" fill-opacity="0.9">不是鸡汤，是项目、现金流、利益分配和人性。</text>

    <text x="1085" y="206" font-size="20" fill="#e6be76" fill-opacity="0.78">偷代码</text>
    <text x="1205" y="206" font-size="20" fill="#7f8790" fill-opacity="0.72">骗上市</text>
    <text x="1310" y="206" font-size="20" fill="#7f8790" fill-opacity="0.72">围猎</text>

    <text x="1068" y="278" font-size="28" font-weight="600" fill="#eef2f6" fill-opacity="0.86">现金流</text>
    <text x="1188" y="278" font-size="24" fill="#a1aab3" fill-opacity="0.78">控制权</text>
    <text x="1328" y="278" font-size="24" fill="#a1aab3" fill-opacity="0.78">利益分配</text>

    <text x="1068" y="353" font-size="22" fill="#7e8891" fill-opacity="0.8">筛单</text>
    <text x="1150" y="353" font-size="22" fill="#7e8891" fill-opacity="0.8">管理</text>
    <text x="1240" y="353" font-size="22" fill="#7e8891" fill-opacity="0.8">销售</text>
    <text x="1334" y="353" font-size="22" fill="#7e8891" fill-opacity="0.8">技术</text>
  </g>

  <g>
    <rect x="1038" y="412" width="360" height="1" fill="#e0b56c" fill-opacity="0.22" />
    <rect x="1038" y="468" width="290" height="1" fill="#e0b56c" fill-opacity="0.15" />
    <rect x="1038" y="524" width="410" height="1" fill="#e0b56c" fill-opacity="0.12" />
    <rect x="1038" y="580" width="250" height="1" fill="#e0b56c" fill-opacity="0.18" />

    <circle cx="1038" cy="412" r="4" fill="#e0b56c" fill-opacity="0.72" />
    <circle cx="1328" cy="468" r="4" fill="#e0b56c" fill-opacity="0.52" />
    <circle cx="1448" cy="524" r="4" fill="#e0b56c" fill-opacity="0.42" />
    <circle cx="1288" cy="580" r="4" fill="#e0b56c" fill-opacity="0.5" />
  </g>

  <g fill="none" stroke="#9d2e2e" stroke-opacity="0.26">
    <path d="M 1090 640 C 1160 614, 1230 694, 1320 666 S 1450 700, 1510 656" stroke-width="2.2" />
    <path d="M 1090 676 C 1140 712, 1236 626, 1305 650 S 1440 620, 1494 642" stroke-width="1.4" />
  </g>

  <text x="120" y="792" font-family="'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif" font-size="18" letter-spacing="3" fill="#727b84">I:\YC_RESEARCH\CLAUDE CODE\BTC_ANALYSIS_TOOL\OUTPUT\IMAGEGEN</text>
