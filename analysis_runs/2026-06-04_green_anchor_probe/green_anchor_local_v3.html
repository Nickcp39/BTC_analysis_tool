<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Local Impulse Anchors</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171b22;
      --panel: #20252e;
      --grid: rgba(255,255,255,.12);
      --text: #e8edf5;
      --muted: #9aa7b8;
      --line: #ff8177;
      --green: #00e676;
      --cyan: #21b7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      background: rgba(23,27,34,.94);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }
    button {
      border: 1px solid rgba(255,255,255,.16);
      background: #29313d;
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.active {
      border-color: #8bb7ff;
      background: #315489;
    }
    main {
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
    }
    .chart-wrap, aside {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
    }
    .chart-wrap {
      min-height: calc(100vh - 88px);
      padding: 10px;
    }
    svg {
      width: 100%;
      height: calc(100vh - 112px);
      display: block;
    }
    aside {
      max-height: calc(100vh - 88px);
      overflow: auto;
      padding: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 12px;
      color: var(--muted);
    }
    .idx {
      color: var(--green);
      font-weight: 700;
    }
    .date {
      color: var(--text);
      font-weight: 650;
    }
    .axis text {
      fill: var(--muted);
      font-size: 11px;
    }
    .axis path, .axis line {
      stroke: rgba(255,255,255,.18);
    }
    .grid line {
      stroke: var(--grid);
    }
    .tooltip {
      position: fixed;
      pointer-events: none;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(5,8,12,.92);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      font-size: 12px;
      display: none;
      z-index: 10;
      line-height: 1.45;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>BTC 大涨/大跌局部解锚点</h1>
    <button data-cycle="2017">2017</button>
    <button data-cycle="2021">2021</button>
    <button data-cycle="2025" class="active">2025</button>
  </header>
  <main>
    <section class="chart-wrap">
      <svg id="chart" viewBox="0 0 1200 720" preserveAspectRatio="none"></svg>
    </section>
    <aside>
      <div id="summary"></div>
      <div id="list"></div>
    </aside>
  </main>
  <div class="tooltip" id="tooltip"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

            .style("left", (event.clientX + 12) + "px")
            .style("top", (event.clientY + 12) + "px")
            .html(`<b>#${d.anchor_index} ${d.date}</b><br>${fmtMoney(d.price)}<br>前跌: ${d.drop_pct}%<br>后涨: +${d.rally_pct}%<br>间隔: ${d.interval_from_prev_days || "-"} 天`);
        })
        .on("mouseleave", () => tooltip.style("display", "none"));

      g.selectAll("text")
        .data(anchors)
        .enter()
        .append("text")
        .attr("x", d => x(d.jsDate) + 8)
        .attr("y", d => y(d.price) - 8)
        .attr("fill", "white")
        .attr("font-size", 12)
        .text(d => d.anchor_index);

      d3.select("#summary").html(`<div style="font-weight:700;margin-bottom:8px">${active} 周期：${anchors.length} 个局部解锚点</div>`);
      d3.select("#list").html(anchors.map(d => `
        <div class="row">
          <div class="idx">#${d.anchor_index}</div>
          <div>
            <div class="date">${d.date} · ${fmtMoney(d.price)}</div>
            <div>前跌 ${d.drop_pct}% · 后涨 +${d.rally_pct}% · 间隔 ${d.interval_from_prev_days || "-"} 天</div>
          </div>
        </div>
      `).join(""));
    }

    document.querySelectorAll("button[data-cycle]").forEach(btn => {
      btn.addEventListener("click", () => {
        active = btn.dataset.cycle;
        document.querySelectorAll("button[data-cycle]").forEach(b => b.classList.toggle("active", b === btn));
        render();
      });
    });
    render();
  </script>
</body>
</html>
